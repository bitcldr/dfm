name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: dfm

jobs:
  # Build one tarball per target on a native runner.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            label: macos_arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            label: macos_x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            label: linux_arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            label: linux_x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # build.rs runs `git describe`

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cross-compile targets need their rust-std added to the 1.96 toolchain slot.
      - name: install aarch64 linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml
          rustup target add aarch64-unknown-linux-gnu

      - name: add cross-compile target
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: package
        id: package
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${BIN}_${tag}_${{ matrix.label }}"
          staging="$name"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${BIN}" "$staging/"
          cp README.md LICENSE "$staging/"
          cp -r docs "$staging/"
          tar -czf "${name}.tar.gz" "$staging"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

  # Attach all archives to a GitHub Release.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true

  # Generate the Homebrew formula and push it to the tap repo.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: render formula
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          repo="${GITHUB_REPOSITORY}"
          base="https://github.com/${repo}/releases/download/${tag}"
          sha() { cut -d' ' -f1 "dist/${BIN}_${tag}_$1.tar.gz.sha256"; }

          mkdir -p Formula
          cat > "Formula/${BIN}.rb" <<EOF
          class Dfm < Formula
            desc "Standalone single-binary dotfiles manager"
            homepage "https://github.com/${repo}"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/${BIN}_${tag}_macos_arm64.tar.gz"
                sha256 "$(sha macos_arm64)"
              end
              on_intel do
                url "${base}/${BIN}_${tag}_macos_x86_64.tar.gz"
                sha256 "$(sha macos_x86_64)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/${BIN}_${tag}_linux_arm64.tar.gz"
                sha256 "$(sha linux_arm64)"
              end
              on_intel do
                url "${base}/${BIN}_${tag}_linux_x86_64.tar.gz"
                sha256 "$(sha linux_x86_64)"
              end
            end

            def install
              bin.install "${BIN}"
            end

            test do
              system "#{bin}/${BIN}", "--help"
            end
          end
          EOF
          cat "Formula/${BIN}.rb"

      - name: push formula to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/bitcldr/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp "Formula/${BIN}.rb" tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${BIN}.rb"
          git commit -m "${BIN} ${tag}"
          git push
